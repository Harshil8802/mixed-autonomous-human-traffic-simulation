[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "mixed-autonomous-human-traffic-simulation"
version = "0.1.0"
description = "Reproducible mixed human and autonomous traffic resilience model"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["traffic_sim*", "experiments*"]
